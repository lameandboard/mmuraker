name: mmuraker
description: A mobileraker-derived Flutter app with MMU support and built-in auto-VPN for remote printer access.

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  hooks_riverpod: ^2.6.1
  riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Routing ───────────────────────────────────────────────────────────────
  go_router: ^14.3.0

  # ── Networking & WebSocket ────────────────────────────────────────────────
  web_socket_channel: ^3.0.1
  dio: ^5.7.0
  http: ^1.2.2

  # ── VPN (multi-protocol) ──────────────────────────────────────────────────
  # WireGuard — fast, modern, open-source
  wireguard_flutter: ^0.1.3
  # OpenVPN — .ovpn config-based
  openvpn_flutter: ^1.3.2

  # ── Local storage ─────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3

  # ── I18n ──────────────────────────────────────────────────────────────────
  easy_localization: ^3.0.7
  easy_localization_loader: ^2.0.1

  # ── Theme / UI ────────────────────────────────────────────────────────────
  flex_color_scheme: ^7.3.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  auto_size_text: ^3.0.0
  badges: ^3.1.2
  percent_indicator: ^4.2.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  responsive_framework: ^1.4.0
  animated_bottom_navigation_bar: ^1.3.3

  # ── File picking ──────────────────────────────────────────────────────────
  file_picker: ^8.1.2

  # ── Forms ─────────────────────────────────────────────────────────────────
  flutter_form_builder: ^9.4.0
  form_builder_validators: ^10.0.1

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.4

  # ── Debug / diagnostics ───────────────────────────────────────────────────
  device_info_plus: ^10.1.2

  # ── Misc utilities ────────────────────────────────────────────────────────
  rxdart: ^0.27.7
  collection: ^1.18.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  permission_handler: ^11.3.1
  network_info_plus: ^5.0.3
  talker_flutter: 4.4.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ">=2.5.0 <2.5.3"
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
